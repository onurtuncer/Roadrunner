simplifications:
- thrust lapse is the algebraic turbojet model, not an engine deck; the cycle analysis
  replaces it
- 'TSFC is one catalogue median at every condition: no part-throttle penalty, loiter
  fuel is understated'
- drag polar is the hand estimate, constant with Mach number, referred to the body
  cross-section
- launch and landing are hover at T = W; transition acceleration to the climb Mach
  number is not flown
- descent burns an assumed weight fraction; climb at maximum power by the energy-height
  method
- installation losses are not applied (ADR-0011); engine mass is the catalogue power
  law at datasheet thrust
- 'no structural mass build-up (ADR-0008): implied empty mass is reported, not closed'
