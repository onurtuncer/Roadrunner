- thrust lapse is the algebraic turbojet model, not an engine deck; the cycle analysis
  replaces it
- 'TSFC is one catalogue median at every condition: no part-throttle penalty, loiter
  fuel is understated'
- drag polar is the hand estimate, constant with Mach number, referred to the body
