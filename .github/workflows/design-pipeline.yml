name: Design Pipeline

# Tier-2 CI (ADR-0014, ADR-0022): execute the notebooks in pipeline
# order, build the documentation site and, on main, publish it to GitHub
# Pages. This is the only workflow that deploys Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Single source of truth for the pipeline order (ADR-0021). Adding a
  # notebook here is the only edit needed for it to run and be published.
  NOTEBOOK_ORDER: >-
    evidence_ledger mission_profile aerodynamics
    reference_engines method_validation constraint_analysis_preliminary
    mission_analysis_preliminary cycle_design_point off_design
    constraint_analysis mission_analysis engine_selection
    uncertainty_and_sensitivity design_summary
  MPLBACKEND: Agg

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    name: Execute notebooks & build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm needs tags for the version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with pyCycle and notebook deps
        run: pip install -r requirements.txt

      - name: Cycle-model tests (need pyCycle; skipped in ci.yml)
        run: pytest tests/test_cycle.py -v

      - name: Execute notebooks (pipeline order)
        run: |
          set -euo pipefail
          mkdir -p executed rendered
          for nb in $NOTEBOOK_ORDER; do
            echo "::group::notebooks/${nb}.ipynb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir executed "notebooks/${nb}.ipynb"
            jupyter nbconvert --to html --output-dir rendered "executed/${nb}.ipynb"
            echo "::endgroup::"
          done

      - name: Design regression pins
        run: pytest tests/test_design_outputs.py -v

      - name: Upload design outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-outputs
          path: |
            out/
            executed/
          retention-days: 30
          if-no-files-found: ignore

      - name: Build site (design report, ADR-0028)
        run: python scripts/build_site.py site rendered
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build-site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
