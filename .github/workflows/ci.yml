name: CI

# Tier-1 CI (ADR-0014): ADR index consistency, lint, unit tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr-index:
    name: ADR index is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every ADR file is listed in adr/README.md and vice versa
        run: |
          set -euo pipefail
          files=$(cd adr && ls [0-9][0-9][0-9][0-9]-*.md | sort)
          listed=$(grep -oE '\]\([0-9]{4}-[^)]+\.md\)' adr/README.md | tr -d ']()' | sort)
          if ! diff <(echo "$files") <(echo "$listed"); then
            echo "::error::adr/README.md and the files in adr/ disagree (see diff above)"
            exit 1
          fi
          echo "ADR index OK: $(echo "$files" | wc -l) records"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src tests scripts

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm needs tags for the version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        # Design-output pins validate regenerable handoffs (out/); they run
        # in the design pipeline against freshly generated ones.
        run: pytest -v --ignore=tests/test_design_outputs.py
