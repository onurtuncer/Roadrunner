# Leave-one-out validation of the engine method (ADR-0012, ADR-0023).
#
# Each catalogue engine in turn is predicted "blind": only its outer
# diameter is used, as imagery would give, plus technology levels taken
# from the OTHER engines. A prediction passes if the published value
# lies inside the predicted interval AND the interval is narrow enough
# to be useful. The limits were set before the validation was run.

# Largest acceptable interval width, as (high - low) / nominal.
max_relative_width:
  thrust_N: 1.0
  air_mass_flow_kg_s: 1.0
  sfc_kg_N_s: 0.6
basis:
  assumption: >-
    A thrust or mass-flow prediction wider than a factor of about three
    end to end, or an SFC prediction wider than about +/-30 %, would not
    discriminate between catalogue engines and is counted as a failure
    even if it contains the published value.
