# Evidence ledger (ADR-0005): what is publicly reported about the vehicle.
#
# Same schema as claims.yaml. Entries with a `quantity` carry a nominal
# value and the low/high bounds actually used downstream. Where sources
# disagree the entry says so; the bounds are then wide enough to cover
# the disagreement, and that width is a result, not a defect.
# accessed: 2026-11-26 for every entry.

- id: length_overall
  statement: About 1.5 m (5 ft) long; the founder said it is shorter than he is tall.
  quantity: length_overall_m
  value: {value: 1.5, low: 1.4, high: 1.8}
  tier: B
  source: https://www.designation-systems.net/dusrm/app4/roadrunner.html
  accessed: 2026-11-26
  corroboration:
    - https://en.defence-ua.com/weapon_and_tech/us_anduril_company_unveiled_drone_killing_reusable_missile-8761.html
    - https://www.twz.com/roadrunner-reusable-anti-air-interceptor-breaks-cover
    - https://en.topwar.ru/231561-barrazhirujuschij-boepripas-perehvatchik-anduril-roadrunner-ssha.html
    - https://www.strategypage.com/htmw/htada/articles/2025010804622.aspx
  note: >-
    No dimension is published by the manufacturer. Two secondary sources
    give about 1.5 m; one reads the "shorter than the founder" remark as
    no more than 1.7 to 1.8 m; one gives 1.8 m. The upper bound covers
    the outlier. This is the single length anchor for all geometry
    (ADR-0007): a better anchor rescales everything.

- id: mass_reported
  statement: One secondary source gives a weight of 85 kg.
  quantity: takeoff_mass_kg
  value: {value: 85.0, low: 40.0, high: 150.0}
  tier: B
  source: https://www.strategypage.com/htmw/htada/articles/2025010804622.aspx
  accessed: 2026-11-26
  note: >-
    Single uncorroborated source that also misidentifies the company's
    nationality and gives 1.8 m height, so treat with caution. The bounds
    are judgement, set wide. Not stated whether this is take-off or empty
    mass. The manufacturer has published no mass.

- id: speed_reported
  statement: The same secondary source gives a top speed of about 700 km/h.
  quantity: speed_max_m_s
  value: {value: 194.4, low: 170.0, high: 300.0}
  tier: B
  source: https://www.strategypage.com/htmw/htada/articles/2025010804622.aspx
  accessed: 2026-11-26
  note: >-
    194.4 m/s is 700 km/h. Uncorroborated; the manufacturer says only
    "high subsonic" (claim speed_high_subsonic). The sample mission's
    dash Mach number rests on that claim, not on this figure; the two
    are compared in the summary.

