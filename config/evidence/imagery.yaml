# Public imagery for geometry measurement (ADR-0007).
#
# Images are NOT committed. Each image is recorded by URL; measurements
# are pixel coordinates in the image as served at that URL.
#
# A measurement is a pair of points. In each image one measurement must
# be the reference, `quantity: length_overall_m`, against which the
# others in the same image are scaled.
#
# `foreshortening` is the judged range of (apparent / true) length for
# features in that image relative to the reference length, from the
# viewing angle: {low: 1.0, high: 1.0} for a clean side-on view.
#
# STATUS: sources are listed; NO measurements have been taken yet.

pixel_pick_uncertainty_px: 3.0   # per endpoint; assumption, revisit per image resolution

