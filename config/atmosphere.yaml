# International Standard Atmosphere (ADR-0017).
#
# Defining constants of the ICAO Standard Atmosphere (ICAO Doc 7488) and
# the US Standard Atmosphere 1976, which are identical over this range.
# These are definitions of the standard, not measurements, so they carry
# no bounds and are not uncertain inputs.
#
# Altitude is geopotential, metres above mean sea level.

sea_level:
  temperature_K: 288.15
  pressure_Pa: 101325.0

gravity_m_s2: 9.80665            # standard gravity g0
gas_constant_J_kg_K: 287.05287   # specific gas constant of dry air
gamma: 1.4                       # ratio of specific heats of air

# Layers, bottom to top: base altitude and temperature lapse rate.
layers:
  - {base_altitude_m: 0.0, lapse_rate_K_m: -0.0065}      # troposphere
  - {base_altitude_m: 11000.0, lapse_rate_K_m: 0.0}      # lower stratosphere

# The model raises outside [floor_m, ceiling_m] rather than extrapolate.
floor_m: 0.0
ceiling_m: 20000.0

# Sutherland's law for dynamic viscosity, mu = beta T^1.5 / (T + S).
sutherland:
  beta_kg_m_s_sqrtK: 1.458e-6
  S_K: 110.4
