# Purchasable small turbojets (ADR-0010, ADR-0023).
#
# Candidate catalogue for engine selection, and the technology database.
# Every number is the vendor's published sea-level static, standard-day
# figure unless noted. `null` means "not yet retrieved from a citable
# source", never zero. Tier A = vendor datasheet or product page;
# tier B = secondary source (to be replaced by the vendor datasheet).
#
# Masses: `mass_engine_kg` is the bare engine as the vendor states it;
# `mass_system_kg` includes the airborne accessories the vendor lists
# (ECU, pump, valves, ...). Vendors draw that line differently; read the
# note before comparing.
#
# This is a paper exercise (ADR-0023): price, lead time and export
# controls are not considered and are not recorded here.
# accessed: 2026-11-26 for every entry.

