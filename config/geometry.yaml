# Geometry reduction settings (ADR-0007).

# Quantities to be measured from imagery, each a length scaled by the
# overall length. The geometry stage fails if any is missing.
required_quantities:
  - body_diameter_m
  - nacelle_outer_diameter_m
  - inlet_capture_diameter_m
  - nozzle_exit_diameter_m
  - engine_bay_length_m
  - wing_span_m
  - wing_root_chord_m

# Engine envelope: what fits inside the measured nacelle.
engine_envelope:
  wall_thickness_m: {value: 0.003, low: 0.002, high: 0.006}
  radial_clearance_m: {value: 0.005, low: 0.003, high: 0.010}
  basis: {assumption: "Composite nacelle skin plus cooling/mounting gap around the engine. No evidence; typical small-airframe values, deliberately wide."}
