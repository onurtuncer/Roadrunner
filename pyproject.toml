[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "roadrunner-re"
dynamic = ["version"]
description = "Propulsion reverse-engineering study of a small twin-turbojet VTOL air vehicle (course project)"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Onur Tuncer", email = "onur.tuncer@itu.edu.tr" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# pyCycle pinned per ADR-0015. Pinned to an upstream commit, not the 4.4.0
# release on PyPI: 4.4.0's tabular thermodynamics fails under NumPy 2
# ("setting an array element with a sequence"); this commit carries the
# upstream fix. Move back to a PyPI release once one includes it.
# Fetched as the GitHub archive of that commit, not with git+https: the
# same pin, but pip needs neither git on PATH nor a clone.
cycle = [
    "om-pycycle @ https://github.com/OpenMDAO/pyCycle/archive/ee7e16126a7a54b5fe35292c53b7eb4e9572620b.zip",
    "openmdao>=3.30",
]
aero = ["aerosandbox>=4.2"]
uq = ["SALib>=1.5"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7.5"]
dev = ["pytest>=7.4", "ruff>=0.4", "markdown>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags (v0.1.0, ...); never edited by hand (ADR-0014).
version_file = "src/roadrunner_re/_version.py"
# Used only where git has no tags to read (a zip download, a shallow clone),
# so a local install never fails on the version.
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["notebooks", "out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"src/roadrunner_re/__init__.py" = ["F401"]
